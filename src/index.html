<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Counter</title></head>
<body>
<main ng-app="counterApp" ng-controller="CounterController as counter">
  <p ng-bind="counter.value"></p>
  <button ng-click="counter.increment()">Add one</button>
</main>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
<script src="app.js"></script>
</body>
</html>
